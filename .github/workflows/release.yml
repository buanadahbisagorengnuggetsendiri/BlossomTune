name: Release

# Rilis lewat tag: `git tag 0.1.0 && git push origin 0.1.0` (atau `v0.1.0`).
# CI membangun APK rilis, memastikan nomor tag sama dengan versionName di
# app/build.gradle.kts, lalu membuat GitHub Release berisi APK, checksum, dan
# changelog.json — berkas terakhir itu yang dibaca pemeriksa pembaruan di app.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag yang dirilis (mis. 0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Tulis cache hanya pada rilis (tag). Kuota penyimpanan Actions 500 MB
          # per akun dan satu cache Gradle Android ~90 MB: setiap push yang
          # menulis cache baru menabrak batas itu, lalu unggahan artefak ditolak.
          cache-read-only: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: chmod +x ./gradlew
      # Sama seperti workflow Build: tanpa berkas ini AGP gagal di
      # :app:validateSigning*, dan rilis tanpa secrets memang ditandatangani
      # dengan debug keystore.
      - name: Generate debug.keystore
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Tag yang tidak cocok dengan versionName berarti APK yang diunggah
      # mengaku versi lain dari yang tertulis di halaman rilis — dan pemeriksa
      # pembaruan di app akan terus menawarkan "versi baru" yang sama.
      - name: Check tag matches versionName
        id: version
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          echo "tag: $TAG  versionName: $NAME"
          if [ "$VERSION" != "$NAME" ]; then
            echo "::error::Tag $TAG tidak cocok dengan versionName $NAME di app/build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Kunci rilis asli dari secret. Tanpa ini build.gradle.kts jatuh ke debug
      # keystore, dan debug keystore di runner dibuat baru tiap run — APK rilis
      # berikutnya jadi tidak bisa menimpa yang sudah terpasang.
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::RELEASE_KEYSTORE_B64 kosong — APK akan ditandatangani debug keystore"
            exit 0
          fi
          mkdir -p app/keystore
          echo "$KEYSTORE_B64" | base64 -d > app/keystore/release.keystore

      - run: ./gradlew :app:lintUniversalFossDebug
      - run: ./gradlew :app:testUniversalFossDebugUnitTest
      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleUniversalFossRelease --stacktrace

      - name: Verify APK is a real release build
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/universalFoss/release/*.apk 2>/dev/null | head -1)
          [ -n "$APK" ] || { echo "::error::APK tidak ada di outputs/apk; isinya:"; find app/build/outputs/apk -name '*.apk'; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          if "$AAPT" dump badging "$APK" | grep -q 'application-debuggable'; then
            echo "::error::$APK is debuggable — release build tidak boleh debuggable"
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK" | grep -E 'certificate DN|SHA-256 digest')
          echo "$CERTS"
          # Rilis publik tidak boleh ditandatangani debug keystore: tanda tangan
          # itu dibuat baru tiap run, jadi tidak ada APK berikutnya yang bisa
          # menimpanya di perangkat pengguna.
          if echo "$CERTS" | grep -q 'CN=Android Debug'; then
            echo "::error::APK rilis ditandatangani debug keystore — periksa secrets RELEASE_KEYSTORE_B64/STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD"
            exit 1
          fi

      - name: Prepare APK, checksum and changelog
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/universalFoss/release/*.apk | head -1)" \
             "dist/BlossomTune-$VERSION-universal.apk"
          (cd dist && sha256sum "BlossomTune-$VERSION-universal.apk" > "BlossomTune-$VERSION-universal.apk.sha256")
          python3 - "$VERSION" <<'EOF'
          import json, sys
          version = sys.argv[1]
          entries = json.load(open("changelog.json", encoding="utf-8"))
          entry = next((e for e in entries if e.get("versionName") == version), None)
          lines = [f"BlossomTune {version}"] if entry is None else []
          if entry is not None:
              if entry.get("summary"):
                  lines += [entry["summary"], ""]
              for section in entry.get("sections", []):
                  lines.append(f"### {section['title']}")
                  lines += [f"- {item}" for item in section.get("items", [])]
                  lines.append("")
          open("dist/notes.md", "w", encoding="utf-8").write("\n".join(lines).strip() + "\n")
          # changelog.json ikut diunggah: layar "Yang baru" di app membacanya
          # dari aset rilis, bukan dari dalam APK.
          json.dump(entries, open("dist/changelog.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          EOF
          cat dist/notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: BlossomTune ${{ steps.version.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/BlossomTune-${{ steps.version.outputs.version }}-universal.apk
            dist/BlossomTune-${{ steps.version.outputs.version }}-universal.apk.sha256
            dist/changelog.json
          fail_on_unmatched_files: true
